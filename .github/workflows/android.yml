name: Generar APK de PiraRed

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recuperar proyecto Android del ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No se encontro el ZIP del proyecto Android."
            exit 1
          fi
          mkdir -p /tmp/pirared
          unzip -o "$ZIP" -d /tmp/pirared
          ROOT=$(find /tmp/pirared -type f -name settings.gradle -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/app" ]; then
            echo "El ZIP no contiene la carpeta app esperada."
            exit 1
          fi
          cp -a "$ROOT/." .
          test -d app

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PiraRed-apk
          path: app/build/outputs/apk/debug/*.apk
