<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a3a"><title>PiraRed</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><span class="pin">P</span><span>Pira<b>Red</b></span></div><button class="glass small" id="profileBtn">Mi cuenta</button></header>
  <main id="screen"></main>
  <nav class="bottom">
    <button data-page="home" class="nav active">⌂<small>Inicio</small></button>
    <button data-page="market" class="nav">▦<small>Compra/Venta</small></button>
    <button data-page="jobs" class="nav">✦<small>Trabajos</small></button>
    <button data-page="profile" class="nav">♙<small>Perfil</small></button>
  </nav>
</div>
<dialog id="accountDialog">
<form method="dialog" class="dialog glass"><button class="close" value="cancel">✕</button><h2 id="accountTitle">Mi cuenta</h2>
<label>Nombre y apellido<input id="nameInput" placeholder="Tu nombre"></label>
<label>Correo o teléfono<input id="contactInput" placeholder="correo o celular"></label>
<label>Contraseña<input id="passwordInput" type="password" placeholder="Contraseña (demo)"></label>
<p class="muted">Prototipo local: todavía no crea cuentas reales ni guarda datos en un servidor.</p>
<button class="primary" id="saveAccount" value="save">Guardar perfil</button></form>
</dialog>
<script src="app.js"></script>
</body></html>
